<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="style.css">
    <title>내 자기소개 페이지</title>
    <!-- 지시사항 2: style.css 연결 -->
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <!-- 지시사항 3: h1 제목 -->
    <h1>안녕하세요! 제 페이지에 오신 것을 환영합니다.</h1>

    <!-- 지시사항 4: padding과 배경색을 넣을 카드 본문 -->
    <div class="card">
      <p>저의 첫 웹페이지에 오신 것을 환영합니다!</p>

      <!-- 지시사항 5: Flexbox로 가로 정렬할 좋아하는 것 목록 -->
      <h3>좋아하는 것 목록</h3>
      <div id="container">
        <div class="box box1">음악</div>
        <div class="box box2">영화</div>
        <div class="box box3">여행</div>
      </div>
    </div>

  </body>
</html>
